<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160600">
  <title>OKVIP - Fortune Gems</title>
  <style>
    :root {
      --site-primary: #12a83a;
      --site-on-primary: #ffffff;
      --site-secondary: #e8ad19;
      --site-on-secondary: #180900;
      --site-background: #160600;
      --site-on-background: #fff8e8;
      --site-font-body: Arial, Helvetica, sans-serif;
      --site-font-heading: Arial, Helvetica, sans-serif;
      --site-heading-scale: 1;
      --site-spacing-scale: 1;
      --site-radius-scale: 1;
      --site-decoration-opacity: 1;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--site-background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--site-font-body);
      background: var(--site-background);
      color: var(--site-on-background);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: var(--site-background);
      color: var(--site-on-background);
      border-radius: 0;
      overflow: hidden;
    }

    .poster {
      width: min(100%, 650px);
      position: relative;
      aspect-ratio: 941 / 1672;
      overflow: hidden;
      isolation: isolate;
      background: #351000;
    }

    .poster-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cta {
      position: absolute;
      z-index: 2;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 9px rgba(0,0,0,.48));
      animation: bounce 3s ease-in-out infinite;
    }

    .cta img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cta-join {
      left: 13.2%;
      top: 61.9%;
      width: 34.2%;
      animation-delay: 0s;
    }

    .cta-web {
      left: 8.0%;
      top: 69.5%;
      width: 46.8%;
      animation-delay: 1.5s;
    }

    .cta:focus-visible {
      outline: 3px solid #fff4a8;
      outline-offset: 4px;
      border-radius: calc(12px * var(--site-radius-scale));
    }

    .cta:active {
      transform: scale(.96);
    }

    @keyframes bounce {
      0%, 72%, 100% { transform: translateY(0) scale(1); }
      8% { transform: translateY(-9px) scale(1.025); }
      16% { transform: translateY(0) scale(1); }
      24% { transform: translateY(-4px) scale(1.012); }
      32% { transform: translateY(0) scale(1); }
    }

    .hint {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 1.2%;
      transform: translateX(-50%);
      max-width: 90%;
      padding: calc(7px * var(--site-spacing-scale)) calc(12px * var(--site-spacing-scale));
      border: 1px solid rgba(255,220,104,.65);
      border-radius: calc(18px * var(--site-radius-scale));
      background: rgba(20, 7, 0, .76);
      color: #fff3c2;
      font-size: clamp(9px, 2.1vw, 12px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      white-space: nowrap;
    }

    .hint.show {
      opacity: 1;
    }

    @media (min-width: 651px) {
      .poster {
        box-shadow: 0 0 50px rgba(255, 170, 0, .16);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta {
        animation: none;
      }
    }
  </style>
</head>

  <script>
    // Thay hai giá trị rỗng bằng URL đích của bạn.
    const LINKS = {
      join: "",
      web: ""
    };

    const hint = document.getElementById("hint");
    let hintTimer;

    document.querySelectorAll("[data-link]").forEach((button) => {
      button.addEventListener("click", (event) => {
        const key = button.dataset.link;
        const destination = LINKS[key];

        if (destination) {
          button.href = destination;
          button.target = "_blank";
          button.rel = "noopener noreferrer";
          return;
        }

        event.preventDefault();
        hint.classList.add("show");
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.remove("show"), 2600);
      });
    });
